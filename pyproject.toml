[project]
name = "modem_data"
version = "1.0.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
  ".git",
  ".idea",
  ".venv",
  "__pycache__",
]
src = ["custom_components", "modem_data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
