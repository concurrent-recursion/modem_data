[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
  ".git",
  ".idea",
  ".venv",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
